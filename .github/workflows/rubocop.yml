name: Rubocop - Run linter

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  run-rubocop:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2.7.0
      - uses: ruby/setup-ruby@v1.310.0
        with:
          bundler-cache: true
      - name: Run Rubocop
        run: bundle exec rubocop
